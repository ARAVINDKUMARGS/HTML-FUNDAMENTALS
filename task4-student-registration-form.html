<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Student Registration Form</title>
</head>
<body>
  <h1>Student Registration Form</h1>
  <!-- NOTE: This is a frontend-only demonstration. Submissions are NOT saved or sent anywhere unless a real backend endpoint is set in the action attribute. The "#" action just reloads the page. -->
  <form action="#" method="get">
    <fieldset>
      <legend>Personal Details</legend>
      <p><label for="fullname">Full name:</label> <input type="text" id="fullname" name="fullname" required></p>
      <p><label for="email">Email:</label> <input type="email" id="email" name="email" required></p>
      <p><label for="phone">Phone:</label> <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Enter a 10-digit number" required></p>
      <p><label for="dob">Date of birth:</label> <input type="date" id="dob" name="dob" required></p>
    </fieldset>
    <fieldset>
      <legend>Gender</legend>
      <input type="radio" id="g-m" name="gender" value="male" required><label for="g-m">Male</label>
      <input type="radio" id="g-f" name="gender" value="female"><label for="g-f">Female</label>
      <input type="radio" id="g-o" name="gender" value="other"><label for="g-o">Other</label>
    </fieldset>
    <fieldset>
      <legend>Course Details</legend>
      <p><label for="course">Course:</label>
        <select id="course" name="course" required>
          <option value="">-- Select --</option>
          <option value="cse">B.E. Computer Science</option>
          <option value="it">B.Tech Information Technology</option>
          <option value="ece">B.E. Electronics</option>
        </select></p>
      <p><label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="40"></textarea></p>
    </fieldset>
    <fieldset>
      <legend>Interests</legend>
      <input type="checkbox" id="i-web" name="interest_web" value="web"><label for="i-web">Web Development</label>
      <input type="checkbox" id="i-ai" name="interest_ai" value="ai"><label for="i-ai">AI</label>
      <input type="checkbox" id="i-data" name="interest_data" value="data"><label for="i-data">Data Analytics</label>
    </fieldset>
    <fieldset>
      <legend>Preferred Mode</legend>
      <input type="radio" id="m-on" name="mode" value="online" required><label for="m-on">Online</label>
      <input type="radio" id="m-off" name="mode" value="offline"><label for="m-off">Offline</label>
    </fieldset>
    <p><button type="submit">Submit</button> <button type="reset">Reset</button></p>
  </form>
</body>
</html>
